<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ronda</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='11'%20fill='none'%20stroke='%23ff6f61'%20stroke-width='5'%20stroke-dasharray='46%2023'%20stroke-linecap='round'/%3E%3C/svg%3E">

        </defs>
        <circle cx="16" cy="16" r="12" fill="none" stroke="url(#bg-grad)" stroke-width="3.2"
                stroke-dasharray="52 24" stroke-linecap="round" transform="rotate(-45 16 16)"/>
        <circle cx="16" cy="16" r="3.4" fill="url(#bg-grad)"/>
      </svg>
      <span class="brand-name">ronda</span>
    </a>
    <div id="auth-area"></div>

  <main class="container">
    <div id="loading" class="page-loading">Loading…</div>
    <div id="room-root" hidden></div>

    <span>Not affiliated with Spotify.</span>
  </footer>

  <script type="module" src="/js/room.js"></script>

</html>
